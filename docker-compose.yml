version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartrepository-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:admin123@postgres-akmal:5432/repository-db
      MINIO_URL_INTERNAL: http://minio-akmal:9000
      MINIO_URL_EXTERNAL: http://localhost:8017
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      QDRANT_URL: http://qdrant-akmal:6333
      QDRANT_COLLECTION: partnership
      QDRANT_API_KEY: 10982e89-6518-4094-9639-526e3c9f1fba
      ELASTICSEARCH_URL: http://elasticsearch-akmal:9200
      GOOGLE_API_KEY: your_gemini_key_here
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: masakmaltop@gmail.com
      SMTP_CODE: vlzjqhsxwluqdtoh
      FRONTEND_URL: https://smartrepository.web.id
    ports:
      - "8022:8000"
    depends_on:
      - postgres-akmal
      - qdrant-akmal
      - minio-akmal
      - elasticsearch-akmal
    networks:
      - partnership-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-akmal
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: repository-db
    ports:
      - "8014:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - partnership-network

  qdrant:
    image: qdrant/qdrant:latest
    platform: linux/amd64
    restart: always
    container_name: qdrant-akmal
    ports:
      - "8015:6333"
      - "8016:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    networks:
      - partnership-network

  minio:
    image: minio/minio:latest
    container_name: minio-akmal
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "8017:9000"
      - "8018:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001" --address ":9000"
    networks:
      - partnership-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "8019:9200"
      - "8020:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - partnership-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana-akmal
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "8021:5601"
    depends_on:
      - elasticsearch
    networks:
      - partnership-network

networks:
  partnership-network:
    name: partnership-network
    driver: bridge

volumes:
  qdrant_data:
  minio_data:
  es_data:
  postgres_data:

configs:
  qdrant_config:
    content: |
      log_level: INFO
      service:
        api_key: "10982e89-6518-4094-9639-526e3c9f1fba"